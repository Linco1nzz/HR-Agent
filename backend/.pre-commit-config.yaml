# 提交前自动格式化与检查。在仓库根执行安装：
#   uv run --project backend pre-commit install -c backend/.pre-commit-config.yaml
# 手动全量检查：
#   uv run --project backend pre-commit run --all-files -c backend/.pre-commit-config.yaml
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  # 工具配置都在 backend/ 下，钩子从仓库根执行时需显式指定，否则会退回默认规则。
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: ["--config=backend/pyproject.toml"]

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: ["--settings-path=backend/pyproject.toml"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.2
    hooks:
      - id: flake8
        args: ["--config=backend/.flake8"]
        # 自动生成的迁移脚本不参与 lint（与 backend/.flake8 的 exclude 保持一致）
        exclude: ^backend/migrations/
