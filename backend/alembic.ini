[alembic]
# Migration script directory
script_location = migrations
# Make `app` importable when running alembic from backend/
prepend_sys_path = .
# Timestamped filenames keep migrations ordered
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = Asia/Shanghai
# The real URL is injected by migrations/env.py from app.core.config
# (kept empty so credentials are never stored in this file)
sqlalchemy.url =

# Auto-format newly generated migration scripts (black + isort are dev deps).
[post_write_hooks]
hooks = black, isort
black.type = console_scripts
black.entrypoint = black
black.options = -q
isort.type = console_scripts
isort.entrypoint = isort
isort.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
